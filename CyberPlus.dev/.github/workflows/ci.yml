name: CyberPlus CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma Client
        run: pnpm --filter @cyberplus/web db:generate

      - name: Run Database Push (SQLite CI)
        run: pnpm --filter @cyberplus/web db:push

      - name: Seed Database
        run: pnpm --filter @cyberplus/web db:seed

      - name: Run Cryptography & Integration Tests
        run: pnpm --filter @cyberplus/web test

      - name: Build SDK Package
        run: pnpm --filter @cyberplus/verify build

      - name: Build Next.js Production Web App
        run: pnpm --filter @cyberplus/web build

