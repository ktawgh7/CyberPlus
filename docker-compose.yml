version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cyberplus-db
    restart: always
    environment:
      POSTGRES_USER: cyberplus
      POSTGRES_PASSWORD: cyberplus_secure_dev_password
      POSTGRES_DB: cyberplus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberplus -d cyberplus"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: cyberplus-mailpit
    restart: always
    ports:
      - "1025:1025"   # SMTP port
      - "8025:8025"   # Web UI port
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
    volumes:
      - mailpit_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberplus-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cyberplus:cyberplus_secure_dev_password@db:5432/cyberplus?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: development_session_secret_cyberplus_min32chars_required
      JWT_PRIVATE_KEY: |
        -----BEGIN RSA PRIVATE KEY-----
        MIIEowIBAAKCAQEA0M5H4vG5xO4s8H2y3a2B...[PROD_PLACEHOLDER]...
        -----END RSA PRIVATE KEY-----
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "CyberPlus Notifications <no-reply@cyberplus.id>"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  mailpit_data:

